<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>仿B站页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f4f4f4;
        }
        /* 顶部导航栏 */
        .top-nav {
            background-color: #fb7299;
            height: 56px;
            display: flex;
            align-items: center;
            padding:0 20px;
            color:white;
        }
        .logo {
            font-size:24px;
            font-weight:bold;
            width:120px;
        }
        .search-box{
            flex:1;
            margin:0 30px;
            display:flex;
        }
        .search-box input{
            flex:1;
            height:36px;
            border-radius: 18px 0 0 18px;
            border:none;
            padding:0 16px;
            outline:none;
        }
        .search-box button{
            background:#ff83a3;
            color:white;
            border:none;
            width:80px;
            border-radius:0 18px 18px 0;
            cursor:pointer;
        }
        .nav-right{
            display:flex;
            gap:20px;
        }
        /* 二级分类导航 */
        .category-bar{
            background:#ffffff;
            height:60px;
            display:flex;
            align-items:center;
            padding:0 20px;
            gap:32px;
            border-bottom:1px solid #eee;
        }
        .category-bar span{
            cursor:pointer;
            color:#666;
        }
        .category-bar span.active{
            color:#fb7299;
        }
        /* 轮播横幅区域 */
        .banner-area{
            margin:20px;
            height:320px;
            background:#cce0ff;
            border-radius:12px;
        }
        /* 视频卡片网格 */
        .container{
            padding:0 20px 40px;
        }
        .video-grid{
            display: grid;
            grid-template-columns: repeat(auto‑fill, minmax(240px,1fr));
            gap:20px;
        }
        .video-card{
            background:#fff;
            border-radius:8px;
            overflow:hidden;
        }
        .card-cover{
            height:140px;
            background:#b8d8f5;
        }
        .card-info{
            padding:8px;
        }
        .card-title{
            height:40px;
            color:#222;
        }
        .card-meta{
            font-size:12px;
            color:#888;
            margin-top:6px;
        }
    </style>
</head>
<body>
    <!--顶部导航-->
    <div class="top-nav">
        <div class="logo">bilibili</div>
        <div class="search-box">
            <input placeholder="请输入搜索内容">
            <button>搜索</button>
        </div>
        <div class="nav-right">
            <span>消息</span>
            <span>头像</span>
            <span>投稿</span>
        </div>
    </div>

    <!--分类导航-->
    <div class="category-bar">
        <span class="active">热门</span>
        <span>番剧</span>
        <span>国创</span>
        <span>动画</span>
        <span>游戏</span>
        <span>音乐</span>
        <span>更多</span>
    </div>

    <!--大横幅轮播-->
    <div class="banner-area">
        <!--这里放轮播图位置-->
    </div>

    <!--视频卡片列表-->
    <div class="container">
        <div class="video-grid">
            <div class="video-card">
                <div class="card-cover"></div>
                <div class="card-info">
                    <div class="card-title">视频标题占位</div>
                    <div class="card-meta">播放 · UP主</div>
                </div>
            </div>
            <div class="video-card">
                <div class="card-cover"></div>
                <div class="card-info">
                    <div class="card-title">视频标题占位</div>
                    <div class="card-meta">播放 · UP主</div>
                </div>
            </div>
            <div class="video-card">
                <div class="card-cover"></div>
                <div class="card-info">
                    <div class="card-title">视频标题占位</div>
                    <div class="card-meta">播放 · UP主</div>
                </div>
            </div>
            <div class="video-card">
                <div class="card-cover"></div>
                <div class="card-info">
                    <div class="card-title">视频标题占位</div>
                    <div class="card-meta">播放 · UP主</div>
                </div>
            </div>
            <div class="video-card">
                <div class="card-cover"></div>
                <div class="card-info">
                    <div class="card-title">视频标题占位</div>
                    <div class="card-meta">播放 · UP主</div>
                </div>
            </div>
            <div class="video-card">
                <div class="card-cover"></div>
                <div class="card-info">
                    <div class="card-title">视频标题占位</div>
                    <div class="card-meta">播放 · UP主</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
